<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختصار الروابط - FawakihAI</title>
    <style>
        /* إعدادات المظهر الأساسية */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e2f; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #2a2a40; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 450px; text-align: center; }
        h2 { margin-bottom: 5px; color: #4facfe; }
        p { font-size: 14px; color: #a0a0b5; margin-bottom: 25px; }
        input[type="url"], input[type="text"] { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #3f3f5a; border-radius: 8px; box-sizing: border-box; font-size: 16px; text-align: left; direction: ltr; background: #1e1e2f; color: #fff; outline: none; }
        input:focus { border-color: #4facfe; }
        button { background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%); color: white; border: none; padding: 14px 20px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; transition: 0.3s; margin-top: 10px; }
        button:hover { opacity: 0.9; transform: translateY(-2px); }
        button:disabled { background: #555; cursor: not-allowed; transform: none; }
        
        .result-box { margin-top: 25px; display: none; background: #1e1e2f; padding: 20px; border-radius: 8px; border: 1px solid #4facfe; }
        .result-box p { color: #fff; margin: 0 0 10px 0; font-weight: bold; }
        .copy-btn { background: #28a745; margin-top: 15px; }
        
        #loading { display: none; color: #4facfe; margin-top: 15px; font-size: 14px; }
        .redirect-msg { text-align: center; padding: 50px; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: #4facfe; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <h2>أداة اختصار الروابط</h2>
        <p>اصنع رابطاً قصيراً ونادراً لموقعك بضغطة زر</p>
        
        <input type="url" id="longUrl" placeholder="https://example.com/your-long-link..." required>
        <button id="generateBtn">توليد الدومين القصير</button>
        <div id="loading">جاري إنشاء الرابط...</div>

        <div class="result-box" id="resultBox">
            <p>تم الإنشاء! رابطك القصير هو:</p>
            <input type="text" id="shortUrl" readonly>
            <button class="copy-btn" id="copyBtn">نسخ الرابط</button>
        </div>
    </div>

    <!-- استدعاء مكاتب فايربيس (الإصدار 10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // إعدادات مشروعك في فايربيس
        const firebaseConfig = {
            apiKey: "AIzaSyBnKsxfa-R-K_wlAF1xhnyhGTu1CFyOGe4",
            databaseURL: "https://fawakihai-default-rtdb.firebaseio.com",
            projectId: "fawakihai"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 1. نظام التوجيه (Redirect System): فحص الرابط عند الفتح
        const urlParams = new URLSearchParams(window.location.search);
        const shortId = urlParams.get('id');

        if (shortId) {
            // إخفاء واجهة الإنشاء وإظهار واجهة التحميل للتوجيه
            document.getElementById('main-container').innerHTML = `
                <div class="redirect-msg">
                    <div class="spinner"></div>
                    <h3>جاري توجيهك إلى الموقع المطلوب...</h3>
                </div>
            `;
            
            const dbRef = ref(db);
            get(child(dbRef, `short_urls/${shortId}`)).then((snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    window.location.href = data.originalUrl; // التوجيه الفوري
                } else {
                    document.getElementById('main-container').innerHTML = `<h3 style="color:#ff4d4d; padding:20px;">عذراً، هذا الرابط غير موجود أو منتهي الصلاحية!</h3>`;
                }
            }).catch((error) => {
                console.error(error);
                document.getElementById('main-container').innerHTML = `<h3 style="color:#ff4d4d; padding:20px;">حدث خطأ في قاعدة البيانات.</h3>`;
            });
        }

        // 2. دالة توليد كود نادر (5 أحرف وأرقام عشوائية)
        function generateUniqueId() {
            const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < 5; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        // 3. برمجة زر الإنشاء
        document.getElementById('generateBtn')?.addEventListener('click', async () => {
            const longUrl = document.getElementById('longUrl').value;
            
            if (!longUrl || !longUrl.startsWith('http')) {
                alert("يرجى إدخال رابط صحيح يبدأ بـ http أو https");
                return;
            }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('generateBtn').disabled = true;

            const newId = generateUniqueId();

            try {
                // حفظ الرابط في فايربيس
                await set(ref(db, 'short_urls/' + newId), {
                    originalUrl: longUrl,
                    createdAt: new Date().toISOString()
                });

                // دمج رابط موقعك الحالي مع الكود القصير
                const currentDomain = window.location.origin + window.location.pathname;
                const finalShortUrl = `${currentDomain}?id=${newId}`;

                document.getElementById('shortUrl').value = finalShortUrl;
                document.getElementById('loading').style.display = 'none';
                document.getElementById('resultBox').style.display = 'block';
                document.getElementById('generateBtn').disabled = false;

            } catch (error) {
                console.error(error);
                alert("حدث خطأ أثناء حفظ الرابط. يرجى التأكد من صلاحيات (Rules) في فايربيس.");
                document.getElementById('loading').style.display = 'none';
                document.getElementById('generateBtn').disabled = false;
            }
        });

        // 4. برمجة زر النسخ
        document.getElementById('copyBtn')?.addEventListener('click', () => {
            const shortUrlInput = document.getElementById('shortUrl');
            shortUrlInput.select();
            shortUrlInput.setSelectionRange(0, 99999); // لدعم الهواتف
            
            navigator.clipboard.writeText(shortUrlInput.value).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.innerText = "تم النسخ بنجاح ✔";
                btn.style.background = "#20c997";
                
                setTimeout(() => {
                    btn.innerText = "نسخ الرابط";
                    btn.style.background = "#28a745";
                }, 2000);
            });
        });
    </script>
</body>
</html>
